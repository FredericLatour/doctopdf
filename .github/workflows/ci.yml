name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check formatting and lint
        run: bun run check
      - name: Check types
        run: bun run typecheck
      - name: Run unit and integration tests
        run: bun run test:fast

  release:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: docker-hub-${{ github.event_name == 'pull_request' && github.ref || 'release' }}
      cancel-in-progress: false
    env:
      DOCKERHUB_IMAGE: fredericlatour/doctopdf
      RELEASE_TAG: ${{ github.ref_name }}
      TEST_IMAGE: doctopdf-release:${{ github.sha }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
      - name: Validate release version
        if: github.event_name == 'push'
        id: version
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Expected a version tag such as v2.0.0 or v2.0.0-rc.1"
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          package_version=$(bun -p "require('./package.json').version")
          if [[ "$version" != "$package_version" ]]; then
            echo "Tag version $version does not match package.json version $package_version"
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Install test dependencies
        run: bun install --frozen-lockfile
      - uses: docker/setup-buildx-action@v4
      - name: Build release image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.TEST_IMAGE }}
          labels: |
            org.opencontainers.image.title=doctopdf
            org.opencontainers.image.description=HTTP service for DOCX and Markdown conversion to PDF
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.value || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Test the release image
        env:
          DOCTOPDF_E2E_IMAGE: ${{ env.TEST_IMAGE }}
        run: bun run test:e2e
      - name: Sign in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Push tested image
        if: github.event_name == 'push'
        env:
          VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          docker tag "$TEST_IMAGE" "$DOCKERHUB_IMAGE:$VERSION"
          docker push "$DOCKERHUB_IMAGE:$VERSION"
          if [[ "$VERSION" != *-* ]]; then
            docker tag "$TEST_IMAGE" "$DOCKERHUB_IMAGE:latest"
            docker push "$DOCKERHUB_IMAGE:latest"
          fi
      - name: Publish GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists."
            exit 0
          fi
          flags=()
          if [[ "$VERSION" == *-* ]]; then
            flags+=(--prerelease --latest=false)
          fi
          printf 'Docker image (linux/amd64): `%s:%s`\n\nRun: `docker run --rm -p 127.0.0.1:3000:3000 %s:%s`\n' \
            "$DOCKERHUB_IMAGE" "$VERSION" "$DOCKERHUB_IMAGE" "$VERSION" > "$RUNNER_TEMP/docker-release-notes.md"
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes \
            --notes-file "$RUNNER_TEMP/docker-release-notes.md" \
            --title "$RELEASE_TAG" "${flags[@]}"
      # The overview describes latest; prereleases must not replace it.
      - name: Sync Docker Hub overview
        if: github.event_name == 'push' && !contains(steps.version.outputs.value, '-')
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_IMAGE }}
          readme-filepath: README.docker.md
